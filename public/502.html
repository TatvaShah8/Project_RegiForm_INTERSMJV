<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>faaaa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .title {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 900;
            text-transform: lowercase;
            letter-spacing: -0.04em;
            line-height: 1;
            background: linear-gradient(135deg, #f59e0b, #ef4444, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            animation: pulse 1.8s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.3)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 45px rgba(245, 158, 11, 0.6)); }
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(90deg, #f59e0b, #ea580c);
            color: #0b0f19;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 30px -5px rgba(234, 88, 12, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .btn-retry:hover {
            transform: scale(1.06);
            filter: brightness(1.15);
            box-shadow: 0 15px 40px -5px rgba(234, 88, 12, 0.7);
        }

        .btn-retry:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">faaaa</h1>
        <button class="btn-retry" id="btn" onclick="retry()">
            <span>Retry 🔄</span>
        </button>
    </div>

    <!-- Preloaded audio element (works both locally and on web server) -->
    <audio id="fa-audio" preload="auto" src="C:\Users\StrongRock\Desktop\VS Code Project\INter SMJV Regestration Form\my-project\public\faaaa.mp3"></audio>

    <script>
        // ===================================================================
        // 🎵 PUT YOUR FILE LOCATION OR WEB LINK HERE:
        // - In same folder:  "faaaa.mp3"
        // - Full web URL:    "https://example.com/faaaa.mp3"
        // - Absolute local:  "C:/Users/StrongRock/Downloads/faaaa.mp3"
        // ===================================================================
        const AUDIO_FILE_LOCATION = "faaaa.mp3";

        let loading = false;

        function retry() {
            if (loading) return;
            loading = true;

            const btn = document.getElementById("btn");
            if (btn) btn.innerHTML = "<span>Connecting... 🔊</span>";

            // Try playing from <audio> element first, then fallback to new Audio()
            const audioElement = document.getElementById("fa-audio");
            const sound = audioElement || new Audio(AUDIO_FILE_LOCATION);

            sound.currentTime = 0;
            const playPromise = sound.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log("Audio playing successfully!");
                }).catch((err) => {
                    console.warn("Audio play blocked by browser or file not found:", err);
                    // Fallback attempt with direct path
                    const fallbackAudio = new Audio(AUDIO_FILE_LOCATION);
                    fallbackAudio.play().catch((e) => console.error("Fallback error:", e));
                });
            }

            // Reload page after audio plays (~1.8 seconds)
            setTimeout(() => {
                window.location.reload();
            }, 1800);
        }
    </script>
</body>
</html>
