<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SMJV GP · 502 Pit Lane</title>
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #15171e;
      --surface-2: #1c1f29;
      --border: #2a2e3b;
      --f1-red: #e10600;
      --text: #f1f5f9;
      --muted: #8b95a7;
      --drs: #00d26a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
      user-select: none;
    }

    .shell {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* F1 Broadcast Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--f1-red);
      border-radius: 6px;
      padding: 9px 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-502 {
      background: var(--f1-red);
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 3px;
      letter-spacing: 0.08em;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      cursor: pointer;
    }

    .btn-icon:hover {
      background: #252936;
    }

    .btn-retry {
      background: #ffffff;
      color: #0c0d10;
      border: none;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s;
    }

    .btn-retry:hover {
      background: #e2e8f0;
    }

    /* Broadcast Telemetry Bar */
    .hud {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .hud-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 4px;
      text-align: center;
    }

    .hud-label {
      font-size: 9px;
      font-family: ui-monospace, monospace;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud-val {
      margin-top: 1px;
      font-size: 15px;
      font-weight: 800;
      font-family: ui-monospace, monospace;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .hud-val.pos {
      color: #facc15;
    }

    .hud-val.drs-ready {
      color: var(--drs);
    }

    /* Circuit Canvas Stage */
    .stage-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 380 / 500;
      max-height: 64dvh;
      background: #141820;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Pit-Wall Menu / Lights Gantry Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 13, 16, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      gap: 12px;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .gantry {
      display: flex;
      gap: 10px;
      background: #090a0d;
      padding: 9px 14px;
      border-radius: 4px;
      border: 1px solid #2e323f;
    }

    .light-pod {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .light {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #23262f;
      border: 1px solid #353947;
    }

    .light.on {
      background: #ff1e1e;
      box-shadow: 0 0 12px rgba(255, 30, 30, 0.9);
      border-color: #ff8080;
    }

    .overlay h2 {
      font-size: 21px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #ffffff;
    }

    .overlay p {
      font-size: 12px;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.45;
    }

    .drivers-grid {
      width: 100%;
      max-height: 215px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding-right: 2px;
    }

    .driver-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      cursor: pointer;
      text-align: left;
      color: #ffffff;
      transition: border-color 0.12s, background 0.12s;
    }

    .driver-card:hover {
      background: var(--surface-2);
    }

    .driver-card.selected {
      border-color: #ffffff;
      background: #222634;
    }

    .driver-bar {
      width: 4px;
      height: 26px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .driver-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .driver-team {
      font-size: 10px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      text-transform: uppercase;
    }

    .btn-race {
      width: 100%;
      max-width: 240px;
      background: var(--f1-red);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 11px 18px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: filter 0.12s, transform 0.08s;
    }

    .btn-race:hover {
      filter: brightness(1.1);
    }

    .btn-race:active {
      transform: scale(0.97);
    }

    /* Steering & DRS Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .ctrl-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #ffffff;
      border-radius: 4px;
      padding: 12px 8px;
      font-size: 12px;
      font-weight: 800;
      font-family: ui-monospace, monospace;
      letter-spacing: 0.06em;
      cursor: pointer;
      touch-action: manipulation;
    }

    .ctrl-btn:active,
    .ctrl-btn.active {
      background: #282d3c;
      border-color: #ffffff;
    }

    .ctrl-btn.drs {
      border-color: rgba(0, 210, 106, 0.45);
      color: var(--drs);
    }

    .ctrl-btn.drs:active,
    .ctrl-btn.drs.active {
      background: rgba(0, 210, 106, 0.18);
      border-color: var(--drs);
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top 502 Maintenance Header -->
    <div class="topbar">
      <div class="brand">
        <span class="badge-502">502</span>
        <div>
          <div class="brand-title">SMJV GP</div>
          <div class="brand-sub">Server maintenance · Pit lane open</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" id="soundBtn" type="button">SFX ON</button>
        <button class="btn-retry" id="retryBtn" type="button" onclick="retrySite()">Reconnect</button>
      </div>
    </div>

    <!-- Broadcast Telemetry HUD -->
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">POS</div>
        <div class="hud-val pos" id="hudPos">P20</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">KM/H</div>
        <div class="hud-val" id="hudSpeed">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">GEAR</div>
        <div class="hud-val" id="hudGear">N</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">PASS</div>
        <div class="hud-val drs-ready" id="hudScore">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">BEST</div>
        <div class="hud-val" id="hudBest">0</div>
      </div>
    </div>

    <!-- Track Stage -->
    <div class="stage-wrap">
      <canvas id="track" width="380" height="500"></canvas>

      <!-- Starting Grid / Driver Menu -->
      <div class="overlay" id="menuOverlay">
        <div class="gantry" id="lightsBar">
          <div class="light-pod"><span class="light"></span><span class="light"></span></div>
          <div class="light-pod"><span class="light"></span><span class="light"></span></div>
          <div class="light-pod"><span class="light"></span><span class="light"></span></div>
          <div class="light-pod"><span class="light"></span><span class="light"></span></div>
          <div class="light-pod"><span class="light"></span><span class="light"></span></div>
        </div>
        <h2 id="menuTitle">SMJV GRAND PRIX</h2>
        <p id="menuDesc">
          Select your constructor seat, watch the 5 red lights, and overtake the grid while the site reconnects.
        </p>

        <div class="drivers-grid" id="driversGrid"></div>

        <button class="btn-race" id="startBtn" type="button">Formation Start</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="leftBtn" type="button">STEER L</button>
      <button class="ctrl-btn drs" id="drsBtn" type="button">DRS</button>
      <button class="ctrl-btn" id="rightBtn" type="button">STEER R</button>
    </div>

    <div class="hint">
      KEYS: [A/D] or [LEFT/RIGHT] STEER · [SPACE/UP] DRS
    </div>
  </div>

      { id: "VER", num: "1", name: "M. Verstappen", team: "Red Bull", car: "RedBullRacing", body: "#162447", wing: "#dc2626", nose: "#facc15", helmet: "#f8fafc", tyre: "#ef4444" },
      { id: "LEC", num: "16", name: "C. Leclerc", team: "Ferrari", car: "Ferrari", body: "#dc2626", wing: "#ffffff", nose: "#111827", helmet: "#ffffff", tyre: "#ef4444" },
      { id: "NOR", num: "4", name: "L. Norris", team: "McLaren", car: "McLaren", body: "#ea580c", wing: "#18181b", nose: "#18181b", helmet: "#a3e635", tyre: "#ef4444" },
      { id: "RUS", num: "63", name: "G. Russell", team: "Mercedes", car: "Mercedes", body: "#334155", wing: "#0f172a", nose: "#14b8a6", helmet: "#38bdf8", tyre: "#eab308" },
      { id: "ALO", num: "14", name: "F. Alonso", team: "Aston Martin", car: "AstonMartin", body: "#065f46", wing: "#022c22", nose: "#a3e635", helmet: "#3b82f6", tyre: "#f8fafc" },
      { id: "ALB", num: "23", name: "A. Albon", team: "Williams", car: "Williams", body: "#1d4ed8", wing: "#0f172a", nose: "#38bdf8", helmet: "#facc15", tyre: "#eab308" },
      { id: "GAS", num: "10", name: "P. Gasly", team: "Alpine", car: "Alpine", body: "#1e293b", wing: "#ec4899", nose: "#38bdf8", helmet: "#f472b6", tyre: "#ef4444" },
      { id: "BEA", num: "87", name: "O. Bearman", team: "Haas", car: "HassF1Team", body: "#3f3f46", wing: "#dc2626", nose: "#ffffff", helmet: "#ef4444", tyre: "#eab308" },
      { id: "LAW", num: "30", name: "L. Lawson", team: "Racing Bulls", car: "RacingBulls", body: "#1e40af", wing: "#f8fafc", nose: "#ef4444", helmet: "#f8fafc", tyre: "#ef4444" },
      { id: "HUL", num: "27", name: "N. Hulkenberg", team: "Audi", car: "Audi", body: "#52525b", wing: "#dc2626", nose: "#e4e4e7", helmet: "#fb923c", tyre: "#f8fafc" },
      { id: "CAD", num: "99", name: "C. Herta", team: "Cadillac", car: "Cadillac", body: "#27272a", wing: "#facc15", nose: "#e4e4e7", helmet: "#facc15", tyre: "#eab308" },
    ];

    const canvas = document.getElementById("track");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const WALL_W = 14;
    const CURB_W = 10;
    const ROAD_X = 42;
    const ROAD_W = W - ROAD_X * 2;
    const LANES = 4;
    const LANE_W = ROAD_W / LANES;

    // Pre-render realistic asphalt aggregate tile
    const asphaltTile = document.createElement("canvas");
    asphaltTile.width = 128;
    asphaltTile.height = 128;
    const aCtx = asphaltTile.getContext("2d");
    aCtx.fillStyle = "#22262e";
    aCtx.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 1600; i++) {
      const gx = Math.random() * 128;
      const gy = Math.random() * 128;
      const shade = Math.random() > 0.5 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.14)";
      aCtx.fillStyle = shade;
      aCtx.fillRect(gx, gy, 1.5, 1.5);
    }
    const asphaltPattern = ctx.createPattern(asphaltTile, "repeat");

    let selectedDriver = DRIVERS[0];
    let soundOn = true;
    let audioCtx = null;

    function tone(freq, dur, vol = 0.05) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = freq;
        gain.gain.value = vol;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    document.getElementById("soundBtn").addEventListener("click", () => {
      soundOn = !soundOn;
      document.getElementById("soundBtn").textContent = soundOn ? "SFX ON" : "SFX OFF";
    });

    const driversGrid = document.getElementById("driversGrid");
    function renderDrivers() {
      driversGrid.innerHTML = "";
      DRIVERS.forEach((d) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "driver-card" + (d.id === selectedDriver.id ? " selected" : "");
        card.innerHTML = `
          <span class="driver-bar" style="background:${d.body}; border-bottom: 6px solid ${d.wing}"></span>
          <img src="${CAR_SPRITES[d.car]}" alt="${d.team}" style="width:16px;height:32px;object-fit:contain;flex-shrink:0;" />
          <div>
            <div class="driver-name">${d.name}</div>
            <div class="driver-team">#${d.num} · ${d.team}</div>
          </div>
        `;
        card.onclick = () => {
          selectedDriver = d;
          renderDrivers();
        };
        driversGrid.appendChild(card);
      });
    }
    renderDrivers();

    let bestScore = 0;
    try {
      bestScore = Number(localStorage.getItem("smjv_gp_best") || "0") || 0;
    } catch {}
    document.getElementById("hudBest").textContent = String(bestScore);

    const keys = { left: false, right: false, drs: false };
    let state = "menu";
    let player = { x: W / 2, y: H - 92, vx: 0, tilt: 0 };
    let rivals = [];
    let drsZones = [];
    let particles = [];
    let roadOffset = 0;
    let speed = 5.4;
    let overtakes = 0;
    let drsCharge = 100;
    let drsActive = false;
    let spawnTimer = 0;
    let drsTimer = 0;
    let lastTime = 0;

    function laneCenter(lane) {
      return ROAD_X + LANE_W * lane + LANE_W / 2;
    }

    function drawTrack() {
      // Dark gravel/runoff trap outside walls
      ctx.fillStyle = "#14171c";
      ctx.fillRect(0, 0, W, H);

      // Asphalt surface with tiled aggregate grain
      ctx.save();
      ctx.translate(0, roadOffset % 128);
      ctx.fillStyle = asphaltPattern || "#22262e";
      ctx.fillRect(ROAD_X, -128, ROAD_W, H + 256);
      ctx.restore();

      // Subtle rubbered-in racing groove in each lane
      for (let i = 0; i < LANES; i++) {
        const cx = laneCenter(i);
        const grad = ctx.createLinearGradient(cx - 18, 0, cx + 18, 0);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(0.5, "rgba(0,0,0,0.22)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(cx - 18, 0, 36, H);
      }

      // White track boundary lines
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillRect(ROAD_X, 0, 2, H);
      ctx.fillRect(ROAD_X + ROAD_W - 2, 0, 2, H);

      // Painted FIA Red/White Kerbs
      const curbH = 26;
      const offset = roadOffset % (curbH * 2);
      for (let y = -curbH * 2 + offset; y < H; y += curbH) {
        const isRed = Math.floor((y - offset) / curbH) % 2 === 0;
        ctx.fillStyle = isRed ? "#b91c1c" : "#e2e8f0";
        ctx.fillRect(ROAD_X - CURB_W, y, CURB_W, curbH);
        ctx.fillRect(ROAD_X + ROAD_W, y, CURB_W, curbH);
        // Kerb shadow lip
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(ROAD_X - CURB_W, y, 2, curbH);
        ctx.fillRect(ROAD_X + ROAD_W + CURB_W - 2, y, 2, curbH);
      }

      // Concrete Pit/Trackside Barriers
      ctx.fillStyle = "#2b303b";
      ctx.fillRect(ROAD_X - CURB_W - WALL_W, 0, WALL_W, H);
      ctx.fillRect(ROAD_X + ROAD_W + CURB_W, 0, WALL_W, H);

      // Barrier panel joints
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      const seg = 64;
      const wOff = roadOffset % seg;
      for (let y = -seg + wOff; y < H; y += seg) {
        ctx.fillRect(ROAD_X - CURB_W - WALL_W, y, WALL_W, 2);
        ctx.fillRect(ROAD_X + ROAD_W + CURB_W, y, WALL_W, 2);
      }

      // Dashed lane dividers
      ctx.strokeStyle = "rgba(255, 255, 255, 0.24)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([20, 28]);
      ctx.lineDashOffset = -roadOffset;
      for (let i = 1; i < LANES; i++) {
        const lx = ROAD_X + LANE_W * i;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, H);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawPirelliTyre(x, y, w, h, compoundColor) {
      ctx.fillStyle = "#101216";
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 2);
      ctx.fill();
      // Subtle tread highlight & Pirelli compound stripe
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(x + 1, y + 2, 1.2, h - 4);
      ctx.fillStyle = compoundColor;
      ctx.fillRect(x + w - 1.5, y + 2.5, 1, h - 5);
    }

    function drawF1Car(x, y, drv, isPlayer, tilt = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);

      // Soft ambient ground shadow offset slightly down-right
      ctx.fillStyle = "rgba(0,0,0,0.52)";
      ctx.beginPath();
      ctx.ellipse(2.5, 4, 15, 31, 0, 0, Math.PI * 2);
      ctx.fill();

      const img = CAR_IMAGES[drv.car];
      if (img && img.complete && img.naturalWidth > 0) {
        const carW = 32;
        const carH = Math.round(carW * (img.naturalHeight / img.naturalWidth));
        ctx.drawImage(img, -carW / 2, -carH / 2, carW, carH);
      } else {
        ctx.fillStyle = drv.body;
        ctx.fillRect(-12, -26, 24, 52);
      }

      // DRS airflow streaks behind rear wing when boosting
      if (isPlayer && drsActive) {
        ctx.strokeStyle = "rgba(0, 210, 106, 0.55)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-11, 28); ctx.lineTo(-12, 42 + Math.random() * 6);
        ctx.moveTo(11, 28); ctx.lineTo(12, 42 + Math.random() * 6);
        ctx.stroke();
      }

      // Driver Code Tag
      ctx.fillStyle = isPlayer ? "#facc15" : "rgba(241,245,249,0.82)";
      ctx.font = "700 9px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(drv.id, 0, -37);

      ctx.restore();
    }

    function spawnSparks(x, y, count = 4) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + 18,
          vx: (Math.random() - 0.5) * 2.4,
          vy: 2 + Math.random() * 3,
          life: 1,
          color: Math.random() > 0.35 ? "#fb923c" : "#fef08a",
        });
      }
    }

    function startLightsSequence() {
      const overlay = document.getElementById("menuOverlay");
      const startBtn = document.getElementById("startBtn");
      const pods = Array.from(document.querySelectorAll("#lightsBar .light-pod"));
      const title = document.getElementById("menuTitle");
      const desc = document.getElementById("menuDesc");

      state = "lights";
      startBtn.disabled = true;
      title.textContent = "STANDING START";
      desc.textContent = `${selectedDriver.name} · #${selectedDriver.num} ${selectedDriver.team}`;
      pods.forEach((p) => p.querySelectorAll(".light").forEach((l) => l.classList.remove("on")));

      let step = 0;
      const timer = setInterval(() => {
        if (step < 5) {
          pods[step].querySelectorAll(".light").forEach((l) => l.classList.add("on"));
          tone(330, 0.07, 0.04);
          step++;
        } else {
          clearInterval(timer);
          setTimeout(() => {
            pods.forEach((p) => p.querySelectorAll(".light").forEach((l) => l.classList.remove("on")));
            tone(660, 0.14, 0.06);
            overlay.classList.add("hidden");
            startBtn.disabled = false;
            resetRace();
            state = "racing";
          }, 420 + Math.random() * 350);
        }
      }, 420);
    }

    function resetRace() {
      player.x = W / 2;
      player.vx = 0;
      player.tilt = 0;
      rivals = [];
      drsZones = [];
      particles = [];
      speed = 5.4;
      overtakes = 0;
      drsCharge = 100;
      drsActive = false;
      spawnTimer = 0;
      drsTimer = 0;
      updateHud();
    }

    function updateHud() {
      const pos = Math.max(1, 20 - overtakes);
      const kmh = state === "racing" ? Math.round(speed * 33 + (drsActive ? 38 : 0)) : 0;
      const gear = kmh === 0 ? "N" : Math.min(8, Math.max(1, Math.floor(kmh / 42)));
      document.getElementById("hudPos").textContent = "P" + pos;
      document.getElementById("hudSpeed").textContent = String(kmh);
      document.getElementById("hudGear").textContent = String(gear);
      document.getElementById("hudScore").textContent = String(overtakes);
      document.getElementById("hudBest").textContent = String(bestScore);
    }

    function endRace() {
      state = "crashed";
      tone(110, 0.25, 0.08);
      if (overtakes > bestScore) {
        bestScore = overtakes;
        try {
          localStorage.setItem("smjv_gp_best", String(bestScore));
        } catch {}
      }
      updateHud();

      const overlay = document.getElementById("menuOverlay");
      const pos = Math.max(1, 20 - overtakes);
      document.getElementById("menuTitle").textContent = pos === 1 ? "P1 · CHECKERED FLAG" : `RETIRED · P${pos}`;
      document.getElementById("menuDesc").textContent =
        `${selectedDriver.name} completed ${overtakes} overtake${overtakes === 1 ? "" : "s"}. Track Best: ${bestScore}.`;
      document.getElementById("startBtn").textContent = "Restart Session";
      overlay.classList.remove("hidden");
    }

    function loop(ts) {
      const dt = Math.min(32, ts - (lastTime || ts)) / 16.67;
      lastTime = ts;

      drawTrack();

      if (state === "racing") {
        const steerForce = 5.2;
        if (keys.left) {
          player.vx = -steerForce;
          player.tilt = -0.08;
        } else if (keys.right) {
          player.vx = steerForce;
          player.tilt = 0.08;
        } else {
          player.vx *= 0.72;
          player.tilt *= 0.75;
        }

        player.x += player.vx * dt;
        const minX = ROAD_X + 18;
        const maxX = ROAD_X + ROAD_W - 18;
        if (player.x < minX) player.x = minX;
        if (player.x > maxX) player.x = maxX;

        if (keys.drs && drsCharge > 4) {
          drsActive = true;
          drsCharge = Math.max(0, drsCharge - 1.3 * dt);
          if (Math.random() < 0.45) spawnSparks(player.x, player.y, 1);
        } else {
          drsActive = false;
          drsCharge = Math.min(100, drsCharge + 0.25 * dt);
        }

        const effectiveSpeed = speed + (drsActive ? 3.2 : 0);
        roadOffset += effectiveSpeed * dt;
        speed = Math.min(10.2, speed + 0.0026 * dt);

        // DRS Detection Strips
        drsTimer += dt;
        if (drsTimer > 155) {
          drsTimer = 0;
          const lane = Math.floor(Math.random() * LANES);
          drsZones.push({ x: laneCenter(lane), y: -40 });
        }

        // Rival Cars
        spawnTimer += dt;
        const spawnInterval = Math.max(25, 55 - speed * 2.6);
        if (spawnTimer > spawnInterval) {
          spawnTimer = 0;
          const pool = DRIVERS.filter((d) => d.id !== selectedDriver.id);
          const drv = pool[Math.floor(Math.random() * pool.length)];
          const lane = Math.floor(Math.random() * LANES);
          const tooClose = rivals.some((r) => r.y < 85 && Math.abs(r.x - laneCenter(lane)) < LANE_W * 0.7);
          if (!tooClose) {
            rivals.push({
              x: laneCenter(lane),
              y: -48,
              drv,
              spd: effectiveSpeed * (0.48 + Math.random() * 0.2),
              passed: false,
            });
          }
        }

        // Render DRS painted track strips
        for (let i = drsZones.length - 1; i >= 0; i--) {
          const p = drsZones[i];
          p.y += effectiveSpeed * dt;
          ctx.strokeStyle = "rgba(0, 210, 106, 0.75)";
          ctx.lineWidth = 2;
          ctx.strokeRect(p.x - 16, p.y - 20, 32, 40);
          ctx.fillStyle = "rgba(0, 210, 106, 0.14)";
          ctx.fillRect(p.x - 16, p.y - 20, 32, 40);
          ctx.fillStyle = "#00d26a";
          ctx.font = "700 9px ui-monospace, monospace";
          ctx.textAlign = "center";
          ctx.fillText("DRS", p.x, p.y + 3);

          if (Math.abs(p.x - player.x) < 26 && Math.abs(p.y - player.y) < 34) {
            drsCharge = 100;
            tone(580, 0.06, 0.03);
            drsZones.splice(i, 1);
            continue;
          }
          if (p.y > H + 50) drsZones.splice(i, 1);
        }

        // Render Rivals
        for (let i = rivals.length - 1; i >= 0; i--) {
          const r = rivals[i];
          r.y += (effectiveSpeed - r.spd * 0.35) * dt;
          drawF1Car(r.x, r.y, r.drv, false, 0);

          if (!r.passed && r.y > player.y + 26) {
            r.passed = true;
            overtakes++;
            tone(480, 0.04, 0.025);
          }

          if (Math.abs(r.x - player.x) < 22 && Math.abs(r.y - player.y) < 44) {
            endRace();
          }

          if (r.y > H + 70) rivals.splice(i, 1);
        }

        // Titanium plank sparks
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.life -= 0.08 * dt;
          if (pt.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = pt.life;
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x, pt.y, 2, 4);
          ctx.globalAlpha = 1;
        }

        updateHud();
      }

      drawF1Car(player.x, player.y, selectedDriver, true, player.tilt);
      requestAnimationFrame(loop);
    }

    document.getElementById("startBtn").addEventListener("click", startLightsSequence);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") {
        keys.drs = true;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") {
        keys.drs = false;
      }
    });

    function bindTouch(id, key) {
      const el = document.getElementById(id);
      const on = (e) => {
        e.preventDefault();
        keys[key] = true;
        el.classList.add("active");
      };
      const off = (e) => {
        e.preventDefault();
        keys[key] = false;
        el.classList.remove("active");
      };
      el.addEventListener("pointerdown", on);
      el.addEventListener("pointerup", off);
      el.addEventListener("pointerleave", off);
      el.addEventListener("pointercancel", off);
    }

    bindTouch("leftBtn", "left");
    bindTouch("rightBtn", "right");
    bindTouch("drsBtn", "drs");

    requestAnimationFrame(loop);
  </script>
</body>
</html>
