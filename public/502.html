        const audio = new Audio(AUDIO_DATA_URI);
        let loading = false;
        let played = false;

        function playSound() {
            try {
                audio.currentTime = 0;
                const p = audio.play();
                if (p !== undefined) {
                    p.then(() => {
                        played = true;
                        console.log("Audio playing successfully!");
                    }).catch((e) => {
                        console.log("Browser waiting for user click to play audio:", e);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        // 1. Attempt autoplay on page load (works if user navigated via click)
        window.addEventListener("DOMContentLoaded", () => {
            playSound();
        });

        // 2. Play on first click anywhere on screen
        document.body.addEventListener("click", () => {
            if (!played) {
                playSound();
            }
        }, { once: true });

        // 3. Play on Retry button click and reload
        function retry(e) {
            if (e) e.stopPropagation();
            if (loading) return;
            loading = true;

            const btn = document.getElementById("btn");
            if (btn) btn.innerHTML = "<span>Connecting... 🔊</span>";

            playSound();

            setTimeout(() => {
                window.location.reload();
            }, 1800);
        }
    </script>
